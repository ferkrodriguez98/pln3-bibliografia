[project]
name = "asistente-bibliografico"
version = "0.1.0"
description = "Asistente multiagente con RAG sobre literatura de EEG (PLN III, MIA FIUBA)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
